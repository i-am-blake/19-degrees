name: Weekly data update
# Rebuilds the whole site from public data every Monday: newest shark-incident database (Zenodo), sea temperature
# (NOAA ERDDAP), tagging (imos-data branch), warm-spell check, downloads, classroom sheets and share images.
# Publishes only if every step and check passes. Start it by hand from the Actions tab at any time.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check only, don't publish (1 = yes)
        default: ""
      rerun_rain:
        description: Rerun the rain tests (claim C6) even if the shark database hasn't changed (1 = yes)
        default: ""
  schedule:
    - cron: "53 16 * * 1"   # Monday, about 8:53 am in Seattle
permissions:
  contents: write
concurrency: { group: site-update, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install -q -r src/requirements.txt numpy pandas
          mkdir -p ~/.local/share/fonts && cp fonts/*.woff ~/.local/share/fonts/ && fc-cache -f >/dev/null
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i -s playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
      - name: Build and check
        env: { NODE_PATH: "${{ runner.temp }}/node_modules", RERUN_RAIN: "${{ inputs.rerun_rain }}" }
        run: bash src/weekly_update.sh
      - name: Keep a preview of the built pages (dry runs only)
        if: inputs.dry_run == '1'
        run: |
          mkdir -p /tmp/pv && cp *.html /tmp/pv/ && cd /tmp/pv && git init -q && git checkout -q -b preview && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898900+github-actions[bot]@users.noreply.github.com" commit -qm "Preview of ${{ github.ref_name }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:preview
      - name: Publish
        if: inputs.dry_run != '1'
        run: |
          git add -A
          git diff --cached --quiet && { echo "Nothing changed this week"; exit 0; }
          git -c user.name="Blake Erickson" -c user.email="323228245+i-am-blake@users.noreply.github.com" commit -qm "Weekly data update, $(date -u +%Y-%m-%d)"
          git pull -q --rebase origin main && git push -q origin main
