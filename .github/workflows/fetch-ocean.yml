name: Fetch Fremantle sea level
# For claim C7. Downloads the monthly Fremantle tide-gauge record, the standard index of the Leeuwin Current's strength,
# from two open sources: PSMSL station 111 (the long record, which lags) and the University of Hawaii Sea Level Center
# (fast-delivery daily means, station 175, for recent months; free to use and redistribute). Adds the files to the
# 'ocean-data' branch without touching the other files there, and removes the Bureau of Meteorology page an earlier
# version saved (the Bureau's default terms don't allow republishing it). Runs monthly; the weekly rebuild reruns claim C7 from it.
on:
  schedule:
    - cron: "23 10 3 * *"   # 3rd of each month, 10:23 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ocean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download
        run: |
          mkdir -p out; : > out/fremantle_log.txt
          curl -sSfL -o out/fremantle_psmsl111.rlrdata "https://psmsl.org/data/obtaining/rlr.monthly.data/111.rlrdata" || echo "psmsl download failed" >> out/fremantle_log.txt
          curl -sSfL --retry 3 -o out/uhslc_fremantle_daily.csv "https://pae-paha.pacioos.hawaii.edu/erddap/tabledap/uhslc_global_daily_fast.csv?time,sea_level&uhslc_id=175" || echo "uhslc download failed" >> out/fremantle_log.txt
          for f in out/*; do echo "$f: $(wc -c < "$f") bytes; last line: $(tail -n 1 "$f" | cut -c1-120)" >> out/fremantle_log.txt; done
          printf "Monthly mean sea level at Fremantle, Western Australia (PSMSL station 111, Revised Local Reference, mm).\nSource: Permanent Service for Mean Sea Level (PSMSL), https://psmsl.org/data/obtaining/stations/111.php\nCite: Holgate, S.J. et al. (2013) New Data Systems and Products at the Permanent Service for Mean Sea Level. Journal of Coastal Research 29(3), 493-504; and PSMSL (%s), Tide Gauge Data, retrieved %s.\n" "$(date -u +%Y)" "$(date -u +%Y-%m-%d)" > out/README.txt
          printf "uhslc_fremantle_daily.csv: University of Hawaii Sea Level Center, station 175 (Fremantle), fast-delivery daily mean sea level, mm, via the PacIOOS ERDDAP (uhslc_global_daily_fast); free to use and redistribute. Cite: Caldwell, P. C., M. A. Merrifield, P. R. Thompson (2015), Sea level measured by tide gauges from global oceans, the Joint Archive for Sea Level holdings (NCEI Accession 0019568), NOAA NCEI, doi:10.7289/V5V40S7W.\n" > out/README_uhslc.txt
          cat out/fremantle_log.txt
      - name: Add to the ocean-data branch
        if: always()
        run: |
          git clone -q --depth 1 --branch ocean-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" br
          cp out/* br/ 2>/dev/null || true; cd br; rm -f bom_fremantle_62230.html README_bom.txt; git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898900+github-actions[bot]@users.noreply.github.com" commit -qm "Fremantle sea level, $(date -u +%Y-%m-%d)" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ocean-data
