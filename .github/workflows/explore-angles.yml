name: Explore new angles (look only)
# Checks six open sources for new claims and runs a first look where the data allows. Changes nothing in the repo or on the site.
on:
  workflow_dispatch:
    inputs:
      only: { description: "Run one section (wiki, usla, osm, prey, heat, eac, redtide); empty runs all", required: false, default: "" }
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Look
        run: |
          pip install -q -r src/requirements.txt numpy pandas openpyxl
          cd src && ONLY="${{ inputs.only }}" python3 - <<'PY' | tee ../report.md
          import csv, io, json, re, math, time, urllib.request, urllib.parse, collections, statistics as st
          UA = {"User-Agent": "19-degrees-explore/1.0 (+https://19-degrees.org)"}
          def get(u, t=180, data=None, h=None):
              r = urllib.request.Request(u, data=data, headers={**UA, **(h or {})}); return urllib.request.urlopen(r, timeout=t).read()
          import os; ONLY = os.environ.get("ONLY", "")
          def section(n): print(f"\n## {n}\n")
          def safe(f):
              try: f()
              except Exception as e: print(f"**Failed:** {type(e).__name__}: {str(e)[:300]}")

          # ---------- A. Attention vs reality ----------
          def wiki():
              section("A. Wikipedia attention vs actual bites")
              arts = ["Shark_attack", "Shark", "Great_white_shark", "Bull_shark", "Tiger_shark", "Jaws_(film)"]
              views = {}
              for a in arts:
                  j = json.loads(get(f"https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/user/{urllib.parse.quote(a, safe='')}/monthly/2015070100/2026110100"))
                  views[a] = {i["timestamp"][:6]: i["views"] for i in j["items"]}
                  top = sorted(views[a].items(), key=lambda x: -x[1])[:5]
                  print(f"- **{a}**: {len(views[a])} months, median {int(st.median(views[a].values())):,}/month; top months: " + ", ".join(f"{m[:4]}-{m[4:]} ({v:,})" for m, v in top))
              # actual bites: Australian database
              h = json.loads(get("https://zenodo.org/api/records/18752301/versions?sort=version&size=1"))["hits"]["hits"][0]
              f = next(x for x in h["files"] if x["key"].endswith(".xlsx"))
              open("asid.xlsx", "wb").write(get(f["links"]["self"], 300))
              import subprocess; r = subprocess.run(["python3", "-I", "asid_to_csv.py", "asid.xlsx", "asid.csv"], capture_output=True, text=True)
              if r.returncode: raise RuntimeError("asid_to_csv: " + r.stderr[-600:])
              rows = list(csv.DictReader(open("asid.csv"))); cols = list(rows[0].keys())
              print(f"\nAustralian database: {len(rows)} records; columns: {', '.join(cols[:25])}")
              yk = next((c for c in cols if c.lower() in ("incident.year", "year")), None); mk = next((c for c in cols if c.lower() in ("incident.month", "month")), None)
              fk = next((c for c in cols if re.search(r"(fatal|injury|outcome)", c, re.I)), None)
              bites = collections.Counter(); fatal = collections.Counter()
              for r in rows:
                  try: ym = f"{int(float(r[yk])):04d}{int(float(r[mk])):02d}"
                  except Exception: continue
                  bites[ym] += 1
                  if fk and re.search(r"fatal", r.get(fk, ""), re.I): fatal[ym] += 1
              ms = sorted(m for m in views["Shark_attack"] if m <= max(bites or ["0"]))
              def corr(x, y):
                  mx, my = st.mean(x), st.mean(y); sx = math.sqrt(sum((a-mx)**2 for a in x)); sy = math.sqrt(sum((b-my)**2 for b in y))
                  return sum((a-mx)*(b-my) for a, b in zip(x, y)) / (sx*sy) if sx and sy else float("nan")
              v = [views["Shark_attack"][m] for m in ms]
              print(f"\nMonths compared: {ms[0]}–{ms[-1]} ({len(ms)})")
              print(f"- Correlation, monthly 'Shark attack' views vs Australian bites that month: {corr(v, [bites[m] for m in ms]):.2f}")
              print(f"- vs Australian fatal bites that month (field `{fk}`): {corr(v, [fatal[m] for m in ms]):.2f}")
              byc = collections.defaultdict(list)
              for m in ms: byc[m[4:]].append(views["Shark_attack"][m])
              print("- Average views by calendar month: " + ", ".join(f"{k}: {int(st.mean(x)):,}" for k, x in sorted(byc.items())))
              print("- Note: English Wikipedia is mostly US/UK readers, so Australian bites are only one driver; a US/global bite series would be the fair test.")
          if ONLY in ('', 'wiki'): safe(wiki)

          # ---------- B. People in the water (US) ----------
          def usla():
              section("B. US Lifesaving Association: beach attendance and rescues")
              for u in ["https://www.usla.org/page/statistics", "https://arc.usla.org/Statistics/public.asp", "https://www.usla.org/page/STATISTICS"]:
                  try:
                      b = get(u, 60).decode("utf-8", "ignore")
                      links = sorted(set(re.findall(r'href="([^"]*(?:stat|Stat|STAT|report|xls|csv)[^"]*)"', b)))[:25]
                      print(f"- `{u}`: reachable, {len(b)//1000} kB; mentions attendance: {'attendance' in b.lower()}; links: {links}")
                  except Exception as e: print(f"- `{u}`: {type(e).__name__} {str(e)[:120]}")
          if ONLY in ('', 'usla'): safe(usla)

          # ---------- C. Where people surf ----------
          def osm():
              section("C. OpenStreetMap surf breaks")
              boxes = {"Australia": (-45, 110, -9, 155), "California": (32, -125, 42, -114), "Hawaii": (18, -161, 23, -154), "South Africa": (-35.5, 16, -22, 33.5), "Reunion": (-21.5, 55.1, -20.8, 55.9), "Brazil": (-34, -54, 5, -34), "US Atlantic & Gulf": (24, -98, 45, -66), "New Caledonia": (-23, 163, -19, 168.5)}
              eps = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter", "https://overpass.private.coffee/api/interpreter"]
              for k, (a, b, c, d) in boxes.items():
                  q = f'[out:json][timeout:180];nwr["sport"="surfing"]({a},{b},{c},{d});out center tags;'
                  for ep in eps:
                      try:
                          j = json.loads(get(ep, 240, data=urllib.parse.urlencode({"data": q}).encode()))
                          el = j["elements"]; named = sum(1 for e in el if e.get("tags", {}).get("name"))
                          print(f"- {k}: {len(el)} surf spots ({named} named)"); break
                      except Exception as e: last = f"{type(e).__name__}"; time.sleep(10)
                  else: print(f"- {k}: all servers failed ({last})")
          if ONLY in ('', 'osm'): safe(osm)

          # ---------- D. Prey ----------
          def prey():
              section("D. Prey: NOAA fish landings and Queensland QFish")
              try:
                  q = urllib.parse.quote(json.dumps({"ts_afs_name": {"$like": "%MENHADEN%"}}))
                  j = json.loads(get(f"https://apps-st.fisheries.noaa.gov/ods/foss/landings/?q={q}&limit=500", 120))
                  it = j.get("items", []); yrs = sorted({i.get("year") for i in it if i.get("year")})
                  print(f"- NOAA FOSS menhaden landings: {len(it)} rows returned (first page), years {yrs[:1]}–{yrs[-1:]}, fields: {list(it[0].keys()) if it else []}")
                  if it: print(f"  sample: {it[0]}")
              except Exception as e: print(f"- NOAA FOSS: {type(e).__name__} {str(e)[:200]}")
              for u in ["https://qfish.fisheries.qld.gov.au/", "https://www.data.qld.gov.au/api/3/action/package_search?q=qfish&rows=20"]:
                  try:
                      b = get(u, 60).decode("utf-8", "ignore")
                      if "package_search" in u:
                          r = json.loads(b)["result"]; print(f"- Queensland open data search 'qfish': {r['count']} datasets: " + "; ".join(x["title"] for x in r["results"][:12]))
                      else: print(f"- QFish site reachable ({len(b)//1000} kB); interactive query tool")
                  except Exception as e: print(f"- `{u}`: {type(e).__name__} {str(e)[:150]}")
          if ONLY in ('', 'prey'): safe(prey)

          # ---------- E. Heatwaves (already claim C19) ----------
          def heat():
              section("E. Marine heatwaves: already on the site as claim C19")
              d = json.load(open("heat.json"))
              for k, v in d.items(): print(f"- {k}: {v['n']} bites; {v['t_pct']}% fell in the warmest tenth of months (chance: 10%), p = {v['t_p']}")
              print("- Possible refinement: a daily heatwave version using the daily beach temperatures (OISST) the site already fetches.")
          if ONLY in ('', 'heat'): safe(heat)

          # ---------- F. East Australian Current ----------
          def eac():
              section("F. East Australian Current moorings (IMOS)")
              base = "https://thredds.aodn.org.au/thredds/catalog/IMOS/DWM/DA/catalog.xml"
              b = get(base, 120).decode()
              dirs = re.findall(r'title="([^"]+)"', b); print(f"- IMOS deep-water array folders: {dirs[:30]}")
              for dname in [x for x in dirs if "EAC" in x.upper()][:6]:
                  try:
                      c = get(base.replace("catalog.xml", f"{dname}/Temperature/catalog.xml"), 120).decode()
                      sub = re.findall(r'title="([^"]+)"', c)
                      years = sorted(set(re.findall(r"_(\d{4})\d{4}T?", c)))
                      print(f"  - {dname}: {len(sub)} entries; years in file names: {years[:1]}–{years[-1:]}; e.g. {sub[:5]}")
                  except Exception as e: print(f"  - {dname}: {type(e).__name__}")
          if ONLY in ('', 'eac'): safe(eac)

          # ---------- G. Florida red tide ----------
          def redtide():
              section("G. Red tides and fish kills (Florida and the Gulf)")
              base = "https://gis.ncdc.noaa.gov/arcgis/rest/services/ms/HABSOS_CellCounts/MapServer"
              m = json.loads(get(base + "?f=json", 90)); print(f"- HABSOS layers: {[(l['id'], l['name']) for l in m.get('layers', [])]}")
              for l in m.get("layers", [])[:4]:
                  try:
                      info = json.loads(get(f"{base}/{l['id']}?f=json", 90)); fields = [f["name"] for f in info.get("fields", [])]
                      n = json.loads(get(f"{base}/{l['id']}/query?where=1%3D1&returnCountOnly=true&f=json", 120)).get("count")
                      tf = next((f for f in fields if re.search(r"date|time", f, re.I)), None)
                      rng = ""
                      if tf:
                          stats = json.dumps([{"statisticType": "min", "onStatisticField": tf, "outStatisticFieldName": "lo"}, {"statisticType": "max", "onStatisticField": tf, "outStatisticFieldName": "hi"}])
                          r = json.loads(get(f"{base}/{l['id']}/query?where=1%3D1&outStatistics={urllib.parse.quote(stats)}&f=json", 120))
                          a0 = r.get("features", [{}])[0].get("attributes", {}); fmt = lambda v: time.strftime("%Y-%m-%d", time.gmtime(v/1000)) if isinstance(v, (int, float)) else v
                          rng = f"{fmt(a0.get('lo'))} to {fmt(a0.get('hi'))}"
                      print(f"  - layer {l['id']} {l['name']}: {n} records; {rng}; fields: {fields[:14]}")
                  except Exception as e: print(f"  - layer {l['id']}: {type(e).__name__} {str(e)[:120]}")
              j = json.loads(get("https://geodata.myfwc.com/api/search/v1/collections/all/items?q=red%20tide&limit=10", 90))
              print("- FWC open data, 'red tide': " + "; ".join(f.get("properties", {}).get("title", "?") for f in j.get("features", [])[:10]))
          if ONLY in ('', 'redtide'): safe(redtide)
          PY
          cat ../report.md >> "$GITHUB_STEP_SUMMARY"
