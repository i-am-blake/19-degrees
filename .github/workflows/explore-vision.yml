name: Explore new ideas (look only)
# What people publicly ask about sharks (search autocomplete, AI conversations). Changes nothing in the repo or on the site.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q pytrends
      - name: Look
        run: cd src && python3 -u -I explore_questions.py
      - uses: actions/upload-artifact@v4
        with: { name: questions, path: questions.json }
