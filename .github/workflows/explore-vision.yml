name: Explore new ideas (look only)
# NMME seasonal forecast folders. Changes nothing in the repo or on the site.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q numpy netCDF4
      - name: Look
        run: |
          cd src && python3 -u -I explore_context.py ASN00058137,ASN00058056,ASN00040717 2026-09-27
          cat ../report.md >> "$GITHUB_STEP_SUMMARY"
