name: Explore new ideas (look only)
# Frontier coasts and seasonal forecast sources. Changes nothing in the repo or on the site.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Look
        run: |
          cd src && python3 -I explore_vision.py | tee ../report.md
          cat ../report.md >> "$GITHUB_STEP_SUMMARY"
