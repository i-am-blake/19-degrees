name: Explore new ideas (look only)
# What people publicly ask about sharks (search autocomplete, AI conversations). Changes nothing in the repo or on the site.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  look:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q pytrends
      - name: Look
        run: cd src && python3 -u -I explore_questions.py
      - name: Save to a data branch (look only)
        run: |
          mkdir /tmp/q && cp questions.json /tmp/q/ && cd /tmp/q && git init -q -b questions-data
          git -c user.name="Blake Erickson" -c user.email="323228245+i-am-blake@users.noreply.github.com" add . 
          git -c user.name="Blake Erickson" -c user.email="323228245+i-am-blake@users.noreply.github.com" commit -qm "Public shark questions (look only)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" questions-data
