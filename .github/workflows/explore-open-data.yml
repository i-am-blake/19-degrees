name: Explore open shark data (look only)
# Downloads candidate open datasets and reports what shark species, years and temperature fields they hold.
# Changes nothing in the repo or on the site. Started by hand.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Look
        run: |
          python3 - <<'PY' | tee report.md
          import csv, io, json, re, tarfile, urllib.request, urllib.parse, collections
          UA = {"User-Agent": "19-degrees-explore/1.0 (+https://19-degrees.org)"}
          def get(u, t=300): return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=t).read()
          BIG = {"carcharhinus leucas": "bull", "galeocerdo cuvier": "tiger", "carcharodon carcharias": "white"}
          print("## 1. US Animal Telemetry Network (IOOS ERDDAP)\n")
          E = "https://erddap.ioos.us/erddap"
          def search(q):
              try: return list(csv.reader(io.StringIO(get(f"{E}/search/index.csv?page=1&itemsPerPage=2000&searchFor=" + urllib.parse.quote(q)).decode())))
              except urllib.error.HTTPError as e: return [] if e.code == 404 else [["error", str(e.code)]]
          for q in ("Carcharodon carcharias", "Galeocerdo cuvier", "Carcharhinus leucas", "white shark", "tiger shark", "bull shark", "atn shark"):
              rows = search(q)
              if not rows: print(f"- search `{q}`: no datasets"); continue
              if rows[0][0] == "error": print(f"- search `{q}`: error {rows[0][1]}"); continue
              h = rows[0]; it = h.index("Title"); idd = h.index("Dataset ID"); got = [r for r in rows[2:] if r]
              print(f"- search `{q}`: {len(got)} datasets")
              for r in got[:15]: print(f"    - {r[it]} (`{r[idd]}`)")
          try:
              info = list(csv.reader(io.StringIO(get(f"{E}/info/atn_collection/index.csv", 120).decode())))
              vars_ = [r[1] for r in info if r and r[0] == "variable"]
              print("\natn_collection variables:", ", ".join(vars_))
              tx = [v for v in vars_ if re.search(r"(taxon|scientific|species|common|vernacular)", v, re.I)]
              for v in tx[:3]:
                  try:
                      d = get(f"{E}/tabledap/atn_collection.csv?{v}&distinct()", 300).decode().splitlines()[2:]
                      sharks = [x for x in d if re.search(r"(shark|carchar|galeocerdo|sphyrna|isurus|prionace|lamna|notorynchus|negaprion)", x, re.I)]
                      print(f"\n`{v}`: {len(d)} distinct values; shark-like: {sharks[:40]}")
                  except Exception as e: print(f"`{v}` distinct failed: {type(e).__name__} {e}")
          except Exception as e: print("atn_collection info failed:", type(e).__name__, e)
          print("\n## 2. NOAA Gulf SEAMAP groundfish trawl (NCEI 0147703)\n")
          try:
              b = None
              for n in range(4):
                  try: b = get("https://www.ncei.noaa.gov/archive/archive-management-system/OAS/bin/prd/jquery/accession/download/147703", 900); break
                  except Exception as e: print(f"try {n+1}: {type(e).__name__} {e}"); import time; time.sleep(60)
              if b is None: raise RuntimeError("NCEI unavailable after 4 tries")
              tf = tarfile.open(fileobj=io.BytesIO(b))
              names = [m for m in tf.getmembers() if m.isfile()]
              print(f"{len(names)} files, {len(b)//1_000_000} MB compressed\n")
              for m in names: print(f"- `{m.name}` ({m.size//1000} kB)")
              print()
              for m in names:
                  if not re.search(r"\.(csv|txt|dat)$", m.name, re.I) or m.size > 400_000_000: continue
                  txt = tf.extractfile(m).read().decode("latin-1")
                  head = txt.splitlines()[0][:300] if txt else ""
                  low = txt.lower()
                  found = {v: low.count(k) for k, v in BIG.items() if k in low}
                  extra = {w: low.count(w) for w in ("carcharhin", "galeocerdo", "sphyrna", "temp")}
                  print(f"**{m.name}**: header `{head}`  \n big three: {found or 'none'}; other counts: {extra}\n")
          except Exception as e: print("SEAMAP download failed:", type(e).__name__, e)
          PY
          cat report.md >> "$GITHUB_STEP_SUMMARY"
