name: Check links
# Opens every outside link on the site once a week. Fails (and GitHub emails the owner) only when a page is gone; sites that block checkers are listed, not failed.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check every outside link
        run: |
          python3 - <<'PY'
          import re, html, glob, urllib.request, concurrent.futures as cf
          urls = set()
          for f in glob.glob("*.html"):
              urls |= {html.unescape(u) for u in re.findall(r'href="(https?://[^"]+)"', open(f, encoding="utf-8").read())}
          urls = sorted(u for u in urls if "ko-fi.com" not in u)
          UA = "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15"
          def check(u):
              for method in ("HEAD", "GET"):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(u, method=method, headers={"User-Agent": UA, "Accept": "text/html,*/*"}), timeout=25)
                      return u, r.status
                  except urllib.error.HTTPError as e:
                      code = e.code
                      if method == "GET": return u, code
                  except Exception as e:
                      if method == "GET": return u, type(e).__name__
              return u, "?"
          with cf.ThreadPoolExecutor(12) as ex: res = list(ex.map(check, urls))
          # Gone = the site says the page doesn't exist (404/410) or the address no longer resolves. These fail the run so GitHub emails the owner.
          # Blocked = the site refuses automated checks (403, 429, timeouts). Those pages usually work in a browser, so they're listed, not failed.
          gone = [(u, s) for u, s in res if s in (404, 410) or s == "URLError"]
          blocked = [(u, s) for u, s in res if (u, s) not in gone and not (isinstance(s, int) and s < 400)]
          print(f"{len(urls)} links checked: {len(gone)} gone, {len(blocked)} blocked by the site")
          for u, s in gone: print(f"::error title=Dead link::{s} {u}")
          out = f"### {len(urls)} links checked\n\n**Gone ({len(gone)})**, fix or replace:\n\n" + ("".join(f"- `{s}` {u}\n" for u, s in gone) or "- none\n")
          out += f"\n**Blocked by the site ({len(blocked)})**, usually fine in a browser:\n\n" + ("".join(f"- `{s}` {u}\n" for u, s in blocked) or "- none\n")
          open("summary.md", "w").write(out)
          open("gone.txt", "w").write(str(len(gone)))
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          [ "$(cat gone.txt)" = "0" ] || { echo "::error::Dead links found, see the run summary"; exit 1; }
