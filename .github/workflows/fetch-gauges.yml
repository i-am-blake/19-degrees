name: Fetch rain gauge records at bite sites
# For claim C6. Finds the nearest long-running rain gauge (NOAA GHCN, Australian Bureau of Meteorology stations) to each
# bite site in src/rain_points.csv and saves its monthly rainfall, a small file, to the 'gauge-data' branch. Runs only when started by hand.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of sites to try (blank for all)
        default: ""
permissions:
  contents: write
jobs:
  gauges:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Find gauges and fetch monthly rainfall
        run: |
          mkdir -p meta out
          curl -sSf -o meta/inv.txt https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-inventory.txt
          curl -sSf -o meta/sta.txt https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-stations.txt
          timeout 25m python3 src/gauge_fetch.py src/rain_points.csv meta/inv.txt meta/sta.txt out "${{ inputs.limit }}" || true
          gzip -9n out/gauge_monthly.csv || true
          printf "Monthly rainfall at the nearest long-running rain gauge to each bite site.\nSource: NOAA NCEI Global Historical Climatology Network (GHCN), Global Summary of the Month; Australian stations from the Bureau of Meteorology. Public domain (US Government work).\nCite: Menne, M.J. et al. (2012), Global Historical Climatology Network - Daily (GHCN-Daily), NOAA National Climatic Data Center, doi:10.7289/V5D21VHZ.\n" > out/README.txt
          ls -la out
      - name: Save to the gauge-data branch
        if: always()
        run: |
          mkdir -p out br; cd br; git init -q -b gauge-data
          cp ../out/* . 2>/dev/null || true
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898900+github-actions[bot]@users.noreply.github.com" commit -qm "Rain gauge records, $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gauge-data
