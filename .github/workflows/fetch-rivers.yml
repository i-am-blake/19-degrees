name: Fetch river mouths
# For claim C6. Asks OpenStreetMap (Overpass API) for rivers on Australia's east coast (24-36 S), keeps only the points
# where they reach the sea, and adds that small file to the 'ocean-data' branch. Runs only when started by hand.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rivers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract river mouths
        run: |
          mkdir -p tmp out
          c=$(curl -sL -A "19-degrees/1.0 (+https://19-degrees.org)" -H "Accept: application/json" -o tmp/osm.json -w "%{http_code} %{size_download}" --data-urlencode 'data=[out:json][timeout:240];way["waterway"="river"](-36.5,149.5,-23.5,154.0);out geom;' https://overpass-api.de/api/interpreter || true); echo "overpass $c" > out/rivers_log.txt
          c=$(curl -sL -o tmp/ne.geojson -w "%{http_code} %{size_download}" https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_coastline.geojson || true); echo "coastline $c" >> out/rivers_log.txt
          python3 src/river_mouths.py tmp/osm.json tmp/ne.geojson out/river_mouths_east.csv 2>&1 | tail -3 >> out/rivers_log.txt || true
          printf "River mouths on Australia's east coast, 23.5-36.5 S: ends of OpenStreetMap rivers within 3 km of the Natural Earth coastline.\nData: (c) OpenStreetMap contributors, ODbL 1.0 (https://www.openstreetmap.org/copyright); Natural Earth coastline, public domain.\n" > out/README_rivers.txt
          cat out/rivers_log.txt
      - name: Add to the ocean-data branch
        if: always()
        run: |
          git clone -q --depth 1 --branch ocean-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" br
          cp out/* br/ 2>/dev/null || true; cd br; git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898900+github-actions[bot]@users.noreply.github.com" commit -qm "River mouths, $(date -u +%Y-%m-%d)" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ocean-data
