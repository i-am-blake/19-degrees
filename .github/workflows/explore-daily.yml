name: Explore daily sea temperature (C25)
on:
  push:
    branches: [daily-sst]
    paths: ["src/explore_tampa.py"]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tampa Bay checks
        run: python3 -I src/explore_tampa.py
