name: Explore daily sea temperature (C25)
on:
  push:
    branches: [daily-sst]
    paths: ["src/explore_daily.py"]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Records from the ocean-data branch
        run: |
          git fetch -q origin ocean-data
          mkdir -p ocean && git archive origin/ocean-data | tar -x -C ocean
      - name: Match each record to that day's sea temperature
        run: python3 -I src/explore_daily.py ocean daily.json
